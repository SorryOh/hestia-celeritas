# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft on Ornithe, the same toolchain as Hestia (each checked against its Maven on 2026-10-12)
minecraft_version=1.8.9
loader_version=0.19.5
# Loom applied as net.fabricmc.fabric-loom-remap (the id for obfuscated versions); needs Gradle 9.7.0+ on JDK 25
loom_version=1.18.4
ploceus_version=1.18.1
# Feather for intermediary generation 2: net.ornithemc:feather-gen2:1.8.9+build.2
feather_build=2

# Celeritas's shared renderer: the only part of Celeritas upstream publishes (maven.taumc.org/releases)
celeritas_common_version=2.5.0-pre.1
# JOML, the math library celeritas-common is built against
joml_version=1.10.5
# Pylon: LWJGL 3.4.3 and SDL3 for 1.8.9, with LWJGL 2's API on top; Celeritas needs LWJGL 3
pylon_version=0.2.2
# Pylon's LWJGL version: the shaderc binding that compiles the Vulkan shaders at build time
lwjgl_version=3.4.3

# Mod: upstream's version, then this build's own counter, then the Vulkan line's (Kora's vulkan branch)
mod_version=2.5.0-pre.1+hestia.8-vk.2
maven_group=com.furiah.hestia
archives_base_name=celeritas-hestia-mc1.8.9
